plugins {
    id 'fabric-loom' version '1.11.8'
}

// One source tree, three jars. The only per-version source difference is Compat.java (the Strength effect was renamed
// in 1.21.5), see src/v1 and src/v2.
//   v1: Minecraft 1.21   - 1.21.4
//   v2: Minecraft 1.21.5 - 1.21.10
//   v3: Minecraft 1.21.11
def variants = [
        v1: [mc: '1.21',    compat: '>=1.21 <=1.21.4',    range: '1.21-1.21.4',    loader: '0.16.5', src: 'v1'],
        v2: [mc: '1.21.5',  compat: '>=1.21.5 <=1.21.10', range: '1.21.5-1.21.10', loader: '0.16.10', src: 'v2'],
        v3: [mc: '1.21.11', compat: '1.21.11',            range: '1.21.11',        loader: '0.17.3', src: 'v2'],
]

def v = variants[findProperty('variant')]
if (v == null) throw new GradleException("Unknown variant '${findProperty('variant')}', use v1, v2 or v3")

// -Pmc=<version> builds a jar for exactly that Minecraft version (compiled against it, named after it and only
// accepting that version). Without it the jar covers the whole range of the variant.
def single = findProperty('mc')
def mcVersion = single ?: v.mc
def mcRange = single ?: v.range
def mcCompat = single ?: v.compat

version = "${project.mod_version}+mc${mcRange}"
group = 'io.github.m4ssivee'
base.archivesName = project.archives_base_name

sourceSets {
    main {
        java.srcDir "src/${v.src}/java"
    }
    // Dev-only in-game self test, never part of the release jar. Run with: -Pvariant=.. -Pmc=.. runCrystalTest
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    mods {
        mcpvp_crystal_optimizer { sourceSet sourceSets.main }
        mcpvp_crystal_selftest { sourceSet sourceSets.gametest }
    }
    runs {
        crystalTest {
            client()
            name = 'Crystal self test'
            source sourceSets.gametest
            runDir = 'run-test'
            programArgs '--username', 'CrystalTester'
        }
    }
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${v.loader}"
}

processResources {
    def props = [version: project.version, loader: v.loader, mc_compat: mcCompat]
    inputs.properties(props)
    filesMatching('fabric.mod.json') {
        expand(props)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
